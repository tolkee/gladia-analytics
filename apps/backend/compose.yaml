name: gladia-analytics
services:
  db:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
      PGDATA: /var/lib/postgresql/data
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  db-gateway:
    image: ghcr.io/drizzle-team/gateway:1.3.0
    ports:
      - 4983:4983
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - db_gateway_data:/app
  minio:
    image: quay.io/minio/minio:latest
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gladia
      MINIO_ROOT_PASSWORD: gladia-local-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: gladia
      MINIO_ROOT_PASSWORD: gladia-local-secret
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do sleep 1; done
        mc mb --ignore-existing local/gladia-analytics
        mc anonymous set none local/gladia-analytics
volumes:
  postgres_data:
  db_gateway_data:
  minio_data:
